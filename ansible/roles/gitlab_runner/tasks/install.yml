---
- name: Install APT repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ gitlab_runner_docker_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - gitlab_runner_executor == 'docker'
    - gitlab_runner_install_docker | bool

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when:
    - gitlab_runner_executor == 'docker'
    - gitlab_runner_install_docker | bool

- name: Configure official GitLab Runner APT repository
  ansible.builtin.deb822_repository:
    name: gitlab-runner
    types:
      - deb
    uris:
      - "https://packages.gitlab.com/runner/gitlab-runner/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    signed_by: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    state: present
    install_python_debian: false
  register: gitlab_runner_repository

- name: Refresh APT cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: gitlab_runner_repository.changed

- name: Install GitLab Runner package
  ansible.builtin.apt:
    name: gitlab-runner
    state: "{{ gitlab_runner_package_state }}"
    update_cache: true
    cache_valid_time: 3600
