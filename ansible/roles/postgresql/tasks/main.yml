---
- name: Validate target operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in postgresql_supported_distributions
    fail_msg: >-
      This role supports Debian and Ubuntu systems using APT.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}.

- name: Validate PostgreSQL configuration inputs
  ansible.builtin.assert:
    that:
      - postgresql_version | string in postgresql_supported_versions
      - postgresql_port | int >= 1
      - postgresql_port | int <= 65535
      - postgresql_listen_addresses | length > 0
      - postgresql_listen_addresses in ["localhost", "*"] or
        (postgresql_listen_addresses is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))
    fail_msg: >-
      PostgreSQL version must be one of {{ postgresql_supported_versions }};
      listen address must be localhost, *, or one IPv4 address;
      port must be between 1 and 65535.

- name: Ensure selected PostgreSQL IPv4 address exists on the target
  ansible.builtin.assert:
    that:
      - postgresql_listen_addresses in ["localhost", "*", "127.0.0.1"] or
        postgresql_listen_addresses in ansible_all_ipv4_addresses
    fail_msg: >-
      PostgreSQL listen address {{ postgresql_listen_addresses }} is not assigned
      to this host. Choose localhost, an address configured on this server,
      or * only when listening on all interfaces is intentional.

- name: Install PGDG repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create PGDG keyring directory
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download official PostgreSQL repository signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    owner: root
    group: root
    mode: "0644"

- name: Verify official PGDG repository signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
  register: postgresql_pgdg_key
  changed_when: false
  failed_when: >-
    postgresql_pgdg_key.rc != 0 or
    'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8' not in postgresql_pgdg_key.stdout

- name: Detect APT architecture
  ansible.builtin.command:
    argv:
      - dpkg
      - --print-architecture
  register: postgresql_apt_architecture
  changed_when: false

- name: Configure official PGDG APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://apt.postgresql.org/pub/repos/apt
      Suites: {{ ansible_distribution_release }}-pgdg
      Architectures: {{ postgresql_apt_architecture.stdout }}
      Components: main
      Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

- name: Install selected PostgreSQL server and client major version
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
    state: "{{ postgresql_package_state }}"
    update_cache: true

- name: Detect installed PostgreSQL clusters
  ansible.builtin.command:
    argv:
      - pg_lsclusters
      - --no-header
  register: postgresql_clusters
  changed_when: false

- name: Extract selected PostgreSQL main cluster version
  ansible.builtin.set_fact:
    postgresql_cluster_version: "{{ (postgresql_clusters.stdout_lines | select('match', '^' ~ (postgresql_version | string) ~ '\s+main\s+') | list | first).split()[0] }}"
  when: postgresql_clusters.stdout_lines | select('match', '^' ~ (postgresql_version | string) ~ '\s+main\s+') | list | length > 0

- name: Verify selected PostgreSQL main cluster exists
  ansible.builtin.assert:
    that:
      - postgresql_cluster_version is defined
    fail_msg: >-
      No PostgreSQL {{ postgresql_version }} 'main' cluster was found.
      Inspect pg_lsclusters and the package installation output.

- name: Ensure requested PostgreSQL port is not used by another cluster
  ansible.builtin.assert:
    that:
      - >-
        postgresql_clusters.stdout_lines
        | reject('match', '^' ~ (postgresql_version | string) ~ '\s+main\s+')
        | select('search', '\s' ~ (postgresql_port | string) ~ '\s')
        | list | length == 0
    fail_msg: >-
      Port {{ postgresql_port }} is already assigned to another PostgreSQL cluster.
      Choose a free port or inspect pg_lsclusters before continuing.

- name: Configure PostgreSQL listen addresses
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_cluster_version }}/main/postgresql.conf"
    regexp: '^\s*#?\s*listen_addresses\s*='
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
  notify: Restart PostgreSQL

- name: Configure PostgreSQL port
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_cluster_version }}/main/postgresql.conf"
    regexp: '^\s*#?\s*port\s*='
    line: "port = {{ postgresql_port }}"
  notify: Restart PostgreSQL

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    enabled: "{{ postgresql_service_enabled }}"
    state: "{{ postgresql_service_state }}"

- name: Apply PostgreSQL configuration before health check
  ansible.builtin.meta: flush_handlers

- name: Verify PostgreSQL is accepting connections
  ansible.builtin.command:
    argv:
      - pg_isready
      - -h
      - "{{ '127.0.0.1' if postgresql_listen_addresses in ['localhost', '*'] else postgresql_listen_addresses }}"
      - -p
      - "{{ postgresql_port | string }}"
  register: postgresql_ready
  changed_when: false
  failed_when: postgresql_ready.rc != 0

- name: Verify the responding PostgreSQL server major version
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -XAt
      - -p
      - "{{ postgresql_port | string }}"
      - -d
      - postgres
      - -c
      - "SHOW server_version;"
  register: postgresql_server_version
  changed_when: false
  failed_when: >-
    postgresql_server_version.rc != 0 or
    not postgresql_server_version.stdout.startswith(postgresql_version ~ '.')
