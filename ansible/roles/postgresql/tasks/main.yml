---
- name: Validate target operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in postgresql_supported_distributions
    fail_msg: >-
      This role supports Debian and Ubuntu systems using APT.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}.

- name: Validate PostgreSQL configuration inputs
  ansible.builtin.assert:
    that:
      - postgresql_port | int >= 1
      - postgresql_port | int <= 65535
      - postgresql_listen_addresses | length > 0
      - postgresql_listen_addresses in ["localhost", "*"] or
        (postgresql_listen_addresses is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$'))
    fail_msg: >-
      PostgreSQL listen address must be localhost, *, or one IPv4 address;
      port must be between 1 and 65535.

- name: Ensure selected PostgreSQL IPv4 address exists on the target
  ansible.builtin.assert:
    that:
      - postgresql_listen_addresses in ["localhost", "*", "127.0.0.1"] or
        postgresql_listen_addresses in ansible_all_ipv4_addresses
    fail_msg: >-
      PostgreSQL listen address {{ postgresql_listen_addresses }} is not assigned
      to this host. Choose localhost, an address configured on this server,
      or * only when listening on all interfaces is intentional.

- name: Install PostgreSQL server and client packages
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - postgresql-client
    state: "{{ postgresql_package_state }}"
    update_cache: true
    cache_valid_time: 3600

- name: Detect the default PostgreSQL cluster
  ansible.builtin.command:
    argv:
      - pg_lsclusters
      - --no-header
  register: postgresql_clusters
  changed_when: false

- name: Extract default PostgreSQL cluster version
  ansible.builtin.set_fact:
    postgresql_cluster_version: "{{ (postgresql_clusters.stdout_lines | select('match', '^[0-9]+\\s+main\\s+') | list | first).split()[0] }}"
  when: postgresql_clusters.stdout_lines | select('match', '^[0-9]+\\s+main\\s+') | list | length > 0

- name: Verify the default PostgreSQL cluster exists
  ansible.builtin.assert:
    that:
      - postgresql_cluster_version is defined
    fail_msg: >-
      No default PostgreSQL 'main' cluster was found after package installation.
      Inspect pg_lsclusters and the distribution package setup.

- name: Configure PostgreSQL listen addresses
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_cluster_version }}/main/postgresql.conf"
    regexp: '^\\s*#?\\s*listen_addresses\\s*='
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
    mode: "0644"
  notify: Restart PostgreSQL

- name: Configure PostgreSQL port
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_cluster_version }}/main/postgresql.conf"
    regexp: '^\\s*#?\\s*port\\s*='
    line: "port = {{ postgresql_port }}"
    mode: "0644"
  notify: Restart PostgreSQL

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    enabled: "{{ postgresql_service_enabled }}"
    state: "{{ postgresql_service_state }}"

- name: Apply PostgreSQL configuration before health check
  ansible.builtin.meta: flush_handlers

- name: Verify PostgreSQL is accepting connections
  ansible.builtin.command:
    argv:
      - pg_isready
      - -h
      - "{{ '127.0.0.1' if postgresql_listen_addresses in ['localhost', '*'] else postgresql_listen_addresses }}"
      - -p
      - "{{ postgresql_port | string }}"
  register: postgresql_ready
  changed_when: false
  failed_when: postgresql_ready.rc != 0
