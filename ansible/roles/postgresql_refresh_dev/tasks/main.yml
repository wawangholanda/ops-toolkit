---
- name: Validate refresh inputs
  ansible.builtin.assert:
    that:
      - postgresql_refresh_source_host | length > 0
      - postgresql_refresh_source_database is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_refresh_source_username | length > 0
      - postgresql_refresh_source_password | length > 0
      - postgresql_refresh_target_database is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_refresh_target_owner is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_refresh_app_username is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_refresh_app_username != postgresql_refresh_target_owner
      - postgresql_refresh_app_password | length >= 16
      - postgresql_refresh_listen_addresses in ['localhost', '*'] or postgresql_refresh_listen_addresses is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - postgresql_refresh_app_client_cidr == '' or postgresql_refresh_app_client_cidr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$')
      - postgresql_refresh_app_client_cidr == '' or postgresql_refresh_listen_addresses not in ['localhost', '*']
      - postgresql_refresh_app_client_cidr | length > 0 or postgresql_refresh_listen_addresses == 'localhost'
      - postgresql_refresh_source_port | int >= 1
      - postgresql_refresh_source_port | int <= 65535
      - postgresql_refresh_target_port | int >= 1
      - postgresql_refresh_target_port | int <= 65535
      - postgresql_refresh_source_sslmode in ['require', 'verify-ca', 'verify-full']
    fail_msg: >-
      Invalid refresh input. Database and role names must use simple PostgreSQL
      identifiers; ports, client version, source credentials, and SSL mode must
      be valid.

- name: Validate the supplied application CIDR and PostgreSQL bind address
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import ipaddress,sys; n=ipaddress.ip_network(sys.argv[1], strict=False); a=ipaddress.ip_address(sys.argv[2]); assert n.version == 4 and a.version == 4 and n.prefixlen > 0 and not a.is_loopback and not a.is_unspecified"
      - "{{ postgresql_refresh_app_client_cidr }}"
      - "{{ postgresql_refresh_listen_addresses }}"
  changed_when: false
  when: postgresql_refresh_app_client_cidr | length > 0

- name: Ensure the requested PostgreSQL bind IP is assigned to the development host
  ansible.builtin.assert:
    that:
      - postgresql_refresh_listen_addresses in ansible_all_ipv4_addresses
    fail_msg: >-
      The requested PostgreSQL listen address is not assigned to this server.
      Use a private interface IP configured on the development host.
  when: postgresql_refresh_app_client_cidr | length > 0

- name: Verify supported target operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in ["Debian", "Ubuntu"]
    fail_msg: "The refresh role currently supports Debian and Ubuntu targets."

- name: Discover RDS version and prepare matching PostgreSQL server
  ansible.builtin.import_tasks: prepare.yml

- name: Remove stale Ops Toolkit managed remote pg_hba rules while listener is local
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_refresh_client_version }}/main/pg_hba.conf"
    regexp: '^host\s+.*# managed by ops-toolkit$'
    state: absent
    owner: postgres
    group: postgres
    mode: "0640"
  register: postgresql_refresh_stale_hba_rules

- name: Reload PostgreSQL after removing stale managed pg_hba rules
  ansible.builtin.command:
    argv:
      - pg_ctlcluster
      - "{{ postgresql_refresh_client_version }}"
      - main
      - reload
  when: postgresql_refresh_stale_hba_rules.changed
  changed_when: true


- name: Check source RDS connectivity and read its server version
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
      - -XAt
      - -v
      - ON_ERROR_STOP=1
      - -h
      - "{{ postgresql_refresh_source_host }}"
      - -p
      - "{{ postgresql_refresh_source_port | string }}"
      - -U
      - "{{ postgresql_refresh_source_username }}"
      - -d
      - "{{ postgresql_refresh_source_database }}"
      - -c
      - "SHOW server_version_num;"
  environment:
    PGPASSWORD: "{{ postgresql_refresh_source_password }}"
    PGSSLMODE: "{{ postgresql_refresh_source_sslmode }}"
    PGCONNECT_TIMEOUT: "10"
  register: postgresql_refresh_source_version_num
  changed_when: false
  no_log: true

- name: Read target PostgreSQL server version
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
      - -XAt
      - -v
      - ON_ERROR_STOP=1
      - -p
      - "{{ postgresql_refresh_target_port | string }}"
      - -d
      - postgres
      - -c
      - "SHOW server_version_num;"
  register: postgresql_refresh_target_version_num
  changed_when: false

- name: Validate PostgreSQL major-version compatibility
  ansible.builtin.assert:
    that:
      - (postgresql_refresh_source_version_num.stdout | int // 10000) <= (postgresql_refresh_client_version | int)
      - (postgresql_refresh_source_version_num.stdout | int // 10000) <= (postgresql_refresh_target_version_num.stdout | int // 10000)
      - (postgresql_refresh_target_version_num.stdout | int // 10000) == (postgresql_refresh_client_version | int)
    fail_msg: >-
      The source major version must not be newer than the installed pg_dump
      client or target server, and the client major version must match the
      target server major version. Source server version number:
      {{ postgresql_refresh_source_version_num.stdout }}; target server version
      number: {{ postgresql_refresh_target_version_num.stdout }}; client major:
      {{ postgresql_refresh_client_version }}. PostgreSQL major-version
      downgrades are not supported by this workflow.

- name: Check whether target database owner role exists
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
      - -XAt
      - -v
      - ON_ERROR_STOP=1
      - -p
      - "{{ postgresql_refresh_target_port | string }}"
      - -d
      - postgres
      - -c
      - "SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_refresh_target_owner }}';"
  register: postgresql_refresh_target_owner_exists
  changed_when: false

- name: Require target database owner role to exist before refresh
  ansible.builtin.assert:
    that:
      - postgresql_refresh_target_owner_exists.stdout | trim == '1'
    fail_msg: >-
      Target role {{ postgresql_refresh_target_owner }} does not exist on the
      development PostgreSQL server. Create the role first or choose an
      existing owner. The target database has not been modified.

- name: Check whether an existing application role has elevated privileges
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
      - -XAt
      - -v
      - ON_ERROR_STOP=1
      - -v
      - "app_user={{ postgresql_refresh_app_username }}"
      - -d
      - postgres
      - -c
      - "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_refresh_app_username }}') THEN CASE WHEN EXISTS (SELECT 1 FROM pg_roles r JOIN pg_authid a ON a.oid = r.oid WHERE r.rolname = '{{ postgresql_refresh_app_username }}' AND (r.rolsuper OR r.rolcreaterole OR r.rolcreatedb OR r.rolreplication OR r.rolbypassrls OR COALESCE(a.rolpassword, '') NOT LIKE 'SCRAM-SHA-256$%')) OR pg_has_role('{{ postgresql_refresh_app_username }}', '{{ postgresql_refresh_target_owner }}', 'MEMBER') OR EXISTS (SELECT 1 FROM pg_roles elevated WHERE (elevated.rolsuper OR elevated.rolcreaterole OR elevated.rolcreatedb OR elevated.rolreplication OR elevated.rolbypassrls) AND pg_has_role('{{ postgresql_refresh_app_username }}', elevated.rolname, 'MEMBER')) THEN '1' ELSE '0' END ELSE '0' END;"
  register: postgresql_refresh_app_role_privileges
  changed_when: false

- name: Reject a privileged existing application role
  ansible.builtin.assert:
    that:
      - postgresql_refresh_app_role_privileges.stdout | trim == '0'
    fail_msg: >-
      The existing application role is privileged, has no SCRAM password, or inherits database-owner privileges.
      Use a dedicated non-superuser login role; the target database has not
      been modified.


- name: Check whether target database already exists
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
      - -XAt
      - -v
      - ON_ERROR_STOP=1
      - -p
      - "{{ postgresql_refresh_target_port | string }}"
      - -d
      - postgres
      - -c
      - "SELECT 1 FROM pg_database WHERE datname = '{{ postgresql_refresh_target_database }}';"
  register: postgresql_refresh_target_exists
  changed_when: false

- name: Protect an existing development database by default
  ansible.builtin.assert:
    that:
      - postgresql_refresh_target_exists.stdout | trim != '1' or postgresql_refresh_overwrite_target | bool
    fail_msg: >-
      Target database {{ postgresql_refresh_target_database }} already exists.
      Set postgresql_refresh_overwrite_target=true only when you intend to
      replace its contents. The source database is never modified.

- name: Create a private temporary directory for the dump
  ansible.builtin.tempfile:
    state: directory
    path: "{{ postgresql_refresh_temp_parent }}"
    prefix: ops-toolkit-pg-refresh-
  register: postgresql_refresh_temp_dir

- name: Secure temporary dump directory
  ansible.builtin.file:
    path: "{{ postgresql_refresh_temp_dir.path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Refresh development database
  block:
    - name: Dump production database from RDS in custom format
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/pg_dump"
          - --no-password
          - --format=custom
          - --file
          - "{{ postgresql_refresh_temp_dir.path }}/production.dump"
          - -h
          - "{{ postgresql_refresh_source_host }}"
          - -p
          - "{{ postgresql_refresh_source_port | string }}"
          - -U
          - "{{ postgresql_refresh_source_username }}"
          - -d
          - "{{ postgresql_refresh_source_database }}"
      environment:
        PGPASSWORD: "{{ postgresql_refresh_source_password }}"
        PGSSLMODE: "{{ postgresql_refresh_source_sslmode }}"
        PGCONNECT_TIMEOUT: "10"
      no_log: true

    - name: Drop existing target database when explicit overwrite is enabled
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/dropdb"
          - --if-exists
          - --force
          - -p
          - "{{ postgresql_refresh_target_port | string }}"
          - "{{ postgresql_refresh_target_database }}"
      when:
        - postgresql_refresh_target_exists.stdout | trim == '1'
        - postgresql_refresh_overwrite_target | bool

    - name: Create target development database
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/createdb"
          - -p
          - "{{ postgresql_refresh_target_port | string }}"
          - -O
          - "{{ postgresql_refresh_target_owner }}"
          - "{{ postgresql_refresh_target_database }}"

    - name: Restore production dump into development database
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/pg_restore"
          - --exit-on-error
          - --no-owner
          - --no-acl
          - --dbname
          - "{{ postgresql_refresh_target_database }}"
          - -p
          - "{{ postgresql_refresh_target_port | string }}"
          - "{{ postgresql_refresh_temp_dir.path }}/production.dump"

    - name: Verify restored database is connectable
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
          - -XAt
          - -v
          - ON_ERROR_STOP=1
          - -p
          - "{{ postgresql_refresh_target_port | string }}"
          - -d
          - "{{ postgresql_refresh_target_database }}"
          - -c
          - "SELECT current_database(), current_user;"
      register: postgresql_refresh_restore_check
      changed_when: false

    - name: Create application login role only when it does not already exist
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
          - -X
          - -v
          - ON_ERROR_STOP=1
          - -v
          - "app_user={{ postgresql_refresh_app_username }}"
          - -d
          - postgres
        stdin: |
          SET password_encryption = 'scram-sha-256';
          \getenv app_password POSTGRESQL_REFRESH_APP_PASSWORD
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')
          \gexec
          ALTER ROLE :"app_user" LOGIN;
      register: postgresql_refresh_app_role_result
      changed_when: "'CREATE ROLE' in postgresql_refresh_app_role_result.stdout"
      environment:
        POSTGRESQL_REFRESH_APP_PASSWORD: "{{ postgresql_refresh_app_password }}"
      no_log: true

    - name: Grant application access to all non-system schemas
      become_user: postgres
      ansible.builtin.command:
        argv:
          - "/usr/lib/postgresql/{{ postgresql_refresh_client_version }}/bin/psql"
          - -X
          - -v
          - ON_ERROR_STOP=1
          - -v
          - "app_user={{ postgresql_refresh_app_username }}"
          - -v
          - "target_owner={{ postgresql_refresh_target_owner }}"
          - -v
          - "target_db={{ postgresql_refresh_target_database }}"
          - -d
          - "{{ postgresql_refresh_target_database }}"
        stdin: |
          GRANT CONNECT ON DATABASE :"target_db" TO :"app_user";
          SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, :'app_user')
          FROM pg_namespace WHERE nspname <> 'information_schema' AND nspname NOT LIKE 'pg_%'
          \gexec
          SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', nspname, :'app_user')
          FROM pg_namespace WHERE nspname <> 'information_schema' AND nspname NOT LIKE 'pg_%'
          \gexec
          SELECT format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA %I TO %I', nspname, :'app_user')
          FROM pg_namespace WHERE nspname <> 'information_schema' AND nspname NOT LIKE 'pg_%'
          \gexec
          SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', role_name, nspname, :'app_user')
          FROM (SELECT DISTINCT n.nspname, r.rolname AS role_name FROM pg_namespace n CROSS JOIN LATERAL (VALUES ('postgres'::text), (:'target_owner'::text)) AS owners(role_name) JOIN pg_roles r ON r.rolname = owners.role_name WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%') AS d
          \gexec
          SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', role_name, nspname, :'app_user')
          FROM (SELECT DISTINCT n.nspname, r.rolname AS role_name FROM pg_namespace n CROSS JOIN LATERAL (VALUES ('postgres'::text), (:'target_owner'::text)) AS owners(role_name) JOIN pg_roles r ON r.rolname = owners.role_name WHERE n.nspname <> 'information_schema' AND n.nspname NOT LIKE 'pg_%') AS d
          \gexec
      changed_when: true


    - name: Configure remote PostgreSQL listen address after restore
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ postgresql_refresh_client_version }}/main/postgresql.conf"
        regexp: '^\s*#?\s*listen_addresses\s*='
        line: "listen_addresses = '{{ postgresql_refresh_listen_addresses }}'"
        owner: postgres
        group: postgres
        mode: "0640"
      register: postgresql_refresh_listen_config
      when: postgresql_refresh_app_client_cidr | length > 0

    - name: Add a CIDR-restricted application rule to pg_hba.conf
      ansible.builtin.lineinfile:
        path: "/etc/postgresql/{{ postgresql_refresh_client_version }}/main/pg_hba.conf"
        regexp: '^host\s+{{ postgresql_refresh_target_database | regex_escape }}\s+{{ postgresql_refresh_app_username | regex_escape }}\s+.*# managed by ops-toolkit$'
        line: "host {{ postgresql_refresh_target_database }} {{ postgresql_refresh_app_username }} {{ postgresql_refresh_app_client_cidr }} scram-sha-256 # managed by ops-toolkit"
        owner: postgres
        group: postgres
        mode: "0640"
      register: postgresql_refresh_pg_hba_rule
      when: postgresql_refresh_app_client_cidr | length > 0

    - name: Restart PostgreSQL only after both remote access rules are in place
      ansible.builtin.service:
        name: postgresql
        state: restarted
      when:
        - postgresql_refresh_app_client_cidr | length > 0
        - postgresql_refresh_listen_config.changed or postgresql_refresh_pg_hba_rule.changed


    - name: Report successful development database refresh
      ansible.builtin.debug:
        msg: >-
          Development database {{ postgresql_refresh_target_database }} was
          restored and connection-checked. Production source was not modified.
  always:
    - name: Remove temporary production dump and working directory
      ansible.builtin.file:
        path: "{{ postgresql_refresh_temp_dir.path }}"
        state: absent
