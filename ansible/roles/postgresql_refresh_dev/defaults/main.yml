---
# Source PostgreSQL (for example, AWS RDS).
postgresql_refresh_source_port: 5432
postgresql_refresh_source_sslmode: require

# Target PostgreSQL is accessed locally through its Unix socket.
postgresql_refresh_target_port: 5432
postgresql_refresh_target_database: "{{ postgresql_refresh_source_database }}"
postgresql_refresh_target_owner: postgres
postgresql_refresh_client_version: "18"

# Existing target databases are protected by default.
postgresql_refresh_overwrite_target: false

# Temporary custom-format dump is created on the target and removed afterward.
postgresql_refresh_temp_parent: /var/tmp
