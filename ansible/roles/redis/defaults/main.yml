---
# Package and service management.
redis_package_name: redis-server
redis_package_state: present
redis_service_name: redis-server
redis_service_enabled: true
redis_service_state: started

# Redis network and security defaults.
# Keep Redis local-only unless an operator explicitly changes this value.
redis_bind_address: "127.0.0.1"
redis_port: 6379
redis_protected_mode: "yes"

# Optional authentication. Supply through Ansible Vault or a protected
# temporary vars file; never commit a real password.
redis_password: ""

# Optional memory controls. Empty maxmemory leaves the OS package default.
redis_maxmemory: ""
redis_maxmemory_policy: "noeviction"

# The role supports Debian-family distributions without pinning release
# numbers. Actual support also depends on the target's Python/Ansible
# compatibility and availability of APT repositories.
redis_supported_distributions:
  - Debian
  - Ubuntu
